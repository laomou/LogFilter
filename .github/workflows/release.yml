name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            bin: logfilter
            name: logfilter-linux-x64
          - target: x86_64-pc-windows-gnu
            os: ubuntu-24.04
            bin: logfilter.exe
            name: logfilter-windows-x64.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: logfilter
            name: logfilter-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            bin: logfilter
            name: logfilter-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compile deps (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: mv target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.name }}

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.name }}
          # Auto-generate release notes from merged PRs since the previous tag.
          # The matrix runs 4 jobs against the same release; the first to arrive
          # creates it with notes, the rest just attach their binary.
          generate_release_notes: true

  publish-crate:
    # crates.io Trusted Publishing: crates.io is configured to trust this repo's
    # release.yml, and GitHub Actions swaps a short-lived OIDC token for a
    # crates.io token — no long-lived API token stored in the repo.
    # One-time setup: on crates.io add a Trusted Publisher for the `logfilter`
    # crate pointing at owner `laomou`, repo `LogFilter`, workflow `release.yml`
    # (same as lmflow). See https://crates.io/docs/trusted-publishing .
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
